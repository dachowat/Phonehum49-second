<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneHum49</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --blue:#3e6ae1; --ink:#171a20; --muted:#5c5e62; }
  *{box-sizing:border-box;margin:0}
  body{font-family:'Prompt',sans-serif;color:var(--ink);background:#fff}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px}

  /* ===== เมนูบน ===== */
  header{position:fixed;top:0;left:0;right:0;height:50px;background:#fff;z-index:10;
    display:flex;align-items:center;justify-content:space-between;padding:0 48px}
  .logo{font-weight:600;letter-spacing:.25em;font-size:1rem}
  nav{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  nav a{padding:6px 14px;font-size:.9rem;font-weight:500;border-radius:4px}
  nav a:hover{background:rgba(0,0,0,.06)}
  .tools{display:flex;gap:18px;font-size:.9rem}

  /* ===== สไลด์ใหญ่ ===== */
  .slider{position:relative;height:100vh;min-height:560px;overflow:hidden;background:#222}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .8s;color:#fff;text-align:center;
    background-size:cover;background-position:center}
  .slide.active{opacity:1}
  /* วิธีใส่รูปจริง: ใส่ image:"รูป.jpg" ในข้อมูลด้านล่าง ถ้าไม่ใส่จะใช้ไล่สีแทน */
  .slide .car{position:absolute;left:50%;bottom:9%;width:min(62vw,760px);transform:translateX(-50%);
    filter:drop-shadow(0 22px 18px rgba(0,0,0,.35))}
  .slide .txt{position:absolute;top:96px;left:0;right:0;padding:0 20px;text-shadow:0 1px 12px rgba(0,0,0,.25)}
  .slide h1{font-size:clamp(2.2rem,5vw,3.2rem);font-weight:500}
  .slide p{margin-top:8px;font-size:1.05rem}
  .slide .link{display:inline-block;margin-top:8px;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
  .btns{display:flex;justify-content:center;gap:8px;margin-top:22px}
  .btn{width:200px;padding:11px 0;border-radius:4px;border:0;font-size:.9rem;font-weight:500}
  .btn.blue{background:var(--blue);color:#fff}
  .btn.white{background:#fff;color:var(--ink)}
  .btn:hover{filter:brightness(.95)}

  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:4px;
    background:#fff;font-size:1.3rem;z-index:5}
  .arrow.prev{left:48px} .arrow.next{right:48px}
  .dots{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5}
  .dots button{width:12px;height:12px;border-radius:50%;border:0;background:rgba(255,255,255,.55);padding:0}
  .dots button.on{background:#fff}

  /* ===== การ์ดประเภทรถ ===== */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:48px}
  .card{position:relative;height:420px;border-radius:4px;overflow:hidden;color:#fff;background-size:cover;background-position:center}
  .card span{position:absolute;top:36px;left:40px;font-weight:500;font-size:1.1rem}
  .card svg{position:absolute;left:50%;bottom:10%;width:70%;transform:translateX(-50%)}
  .card:hover{filter:brightness(1.05)}

  .info{padding:20px 48px 60px;text-align:center}
  .info h2{font-weight:500;font-size:1.8rem}
  .info p{color:var(--muted);margin:8px 0 16px}
  footer{background:var(--ink);color:#aaa;text-align:center;padding:22px;font-size:.85rem}

  .slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .slide.has-video::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);z-index:1}
  .slide .txt{z-index:2}
  @media (max-width:760px){
    header{padding:0 16px} nav{display:none}
    .arrow.prev{left:12px} .arrow.next{right:12px}
    .cards{padding:24px 16px}
  }
  @media (prefers-reduced-motion:reduce){.slide{transition:none}}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">PhoneHum49</a>
  <nav>
    <a href="#">รถทั้งหมด</a><a href="#">รถไฟฟ้า</a><a href="#">ไฟแนนซ์</a><a href="#">เกี่ยวกับเรา</a><a href="#contact">ติดต่อ</a>
  </nav>
  <div class="tools"><a href="tel:0800000000">โทร 08x-xxx-xxxx</a></div>
</header>

<!-- ตัวรถ SVG (ใช้แทนรูปจริงไปก่อน) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sedan" viewBox="0 0 300 120">
    <path d="M14 90 L24 70 Q30 62 44 60 L90 54 Q118 20 150 18 Q190 16 214 40 L244 56 L274 62 Q288 66 288 80 L288 90 Z" fill="currentColor"/>
    <path d="M112 50 Q132 28 154 27 Q186 26 202 46 Z" fill="#1c2430" opacity=".85"/>
    <circle cx="80" cy="92" r="21" fill="#15191f"/><circle cx="80" cy="92" r="9" fill="#8b94a0"/>
    <circle cx="226" cy="92" r="21" fill="#15191f"/><circle cx="226" cy="92" r="9" fill="#8b94a0"/>
  </symbol>
  <symbol id="suv" viewBox="0 0 300 120">
    <path d="M14 92 L18 58 Q20 48 34 46 L76 42 L94 18 Q98 14 110 14 L224 14 Q234 14 240 22 L256 46 L278 52 Q290 56 290 70 L290 92 Z" fill="currentColor"/>
    <path d="M102 24 L220 24 L240 44 L90 44 Z" fill="#1c2430" opacity=".85"/>
    <circle cx="78" cy="94" r="23" fill="#15191f"/><circle cx="78" cy="94" r="10" fill="#8b94a0"/>
    <circle cx="228" cy="94" r="23" fill="#15191f"/><circle cx="228" cy="94" r="10" fill="#8b94a0"/>
  </symbol>
  <symbol id="pickup" viewBox="0 0 300 120">
    <path d="M12 92 L14 64 Q16 56 28 54 L60 50 L84 24 Q90 18 102 18 L152 18 Q160 18 164 26 L172 52 L286 52 Q292 52 292 60 L292 92 Z" fill="currentColor"/>
    <path d="M94 28 L152 28 L160 50 L74 50 Z" fill="#1c2430" opacity=".85"/>
    <circle cx="70" cy="94" r="22" fill="#15191f"/><circle cx="70" cy="94" r="9" fill="#8b94a0"/>
    <circle cx="234" cy="94" r="22" fill="#15191f"/><circle cx="234" cy="94" r="9" fill="#8b94a0"/>
  </symbol>
</svg>

<main>
  <div class="slider" id="slider" aria-roledescription="carousel">
    <button class="arrow prev" id="prev" aria-label="ก่อนหน้า">‹</button>
    <button class="arrow next" id="next" aria-label="ถัดไป">›</button>
    <div class="dots" id="dots"></div>
  </div>

    <section class="cards">
    <a class="card" href="#" style="background-image:url(suv.jpg)">
      <span>SUV</span>
    </a>
    <a class="card" href="#" style="background-image:url(sedan.jpg)">
      <span>รถเก๋ง</span>
    </a>
    <a class="card" href="#" style="background-image:url(pickup.jpg)">
      <span>รถกระบะ</span>
    </a>
  </section>

  <section class="info" id="contact">
    <h2>อยากดูรถจริง? นัดเข้าชมได้เลย</h2>
    <p>เปิดทุกวัน 00.00 – 00.00 น. | โทร 080-394-9643 | LINE: @Phonehum 49</p>
    <a class="btn blue" style="display:inline-block;text-align:center" href="tel:0800000000">โทรเลย</a>
  </section>
</main>

<footer>© 2026 PhoneHum49 — ข้อมูลเป็นตัวอย่าง แก้เป็นของจริงได้</footer>

<script>
  /* ===== ข้อมูลสไลด์: แก้/เพิ่ม/ลบได้ =====
     image: ใส่ชื่อไฟล์รูปพื้นหลัง เช่น "hero1.jpg" (ไม่ใส่ก็ได้ จะใช้ไล่สีแทน)
     shape: sedan / suv / pickup   color: สีรถ                          */
  const slides = [
    { title:"NIGHT REAPER X — ราชันย์อสูรแห่งรัตติกาล 🦇💜", sub:"“ไม่ได้เกิดมาเพื่อวิ่งตามใคร แต่เกิดมาเพื่อให้ทั้งถนนต้องหลีกทาง ",
      link:"นัดทดลองขับ", shape:"sedan", color:"#b5321f", image:"", video:"car3.mp4",
      bg:"linear-gradient(#cdd9e6,#8fa3b8 55%,#6a6f73 55%)" },
    { title:"Tesla Nova X", sub:"TESLA NOVA X SUV 7 ที่นั่งแห่งโลกอนาคต ดีไซน์ล้ำจักรวาล พลังไฟฟ้าเหนือขีดจำกัด หรูหรา อัจฉริยะ พร้อมพาคุณทะยานสู่ทุกมิติแห่งการเดินทาง",
      link:"นัดทดลองขับ", shape:"suv", color:"#2b2f33", image:"", video:"car2.mp4",
      bg:"linear-gradient(#e8d2ab,#b98b55 55%,#555a5e 55%)" },
    { title:"lsuBoat B-BoatMax", sub:"กระบะแกร่ง ใช้งานได้ทุกวัน รับประกัน จนโฟนตาย",
      link:"นัดทดลองขับ", shape:"pickup", color:"#e9ecef", image:"", video:"car1.mp4",
      bg:"linear-gradient(#d3ddc6,#7f9060 55%,#5a5e5a 55%)" }
  ];

  const slider = document.getElementById('slider');
  const dots = document.getElementById('dots');
  let cur = 0, timer;

  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'slide' + (i === 0 ? ' active' : '');
    el.style.backgroundImage = s.image ? `url(${s.image})` : s.bg;
        if (s.video) el.classList.add('has-video');
    el.innerHTML = `
      ${s.video ? `<video src="${s.video}" autoplay muted loop playsinline></video>` : ''}
      <div class="txt">
        <h1>${s.title}</h1>
        <p>${s.sub}</p>
        <a class="link" href="#contact">${s.link}</a>
        <div class="btns">
          <a class="btn blue" href="order.html?car=${i}">สั่งจอง</a>
          <a class="btn white" href="#contact">ดูรายละเอียด</a>
        </div>
      </div>
      ${(s.image || s.video) ? '' : `<svg class="car" style="color:${s.color}"><use href="#${s.shape}"/></svg>`}`;
    slider.insertBefore(el, document.getElementById('prev'));

    const d = document.createElement('button');
    d.setAttribute('aria-label', 'สไลด์ ' + (i + 1));
    d.onclick = () => go(i);
    dots.appendChild(d);
  });

  function go(n){
    cur = (n + slides.length) % slides.length;
    document.querySelectorAll('.slide').forEach((el, i) => el.classList.toggle('active', i === cur));
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === cur));
    clearInterval(timer);
    timer = setInterval(() => go(cur + 1), 6000);   // เลื่อนอัตโนมัติทุก 6 วินาที
  }
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  go(0);
</script>
</body>
</html>
